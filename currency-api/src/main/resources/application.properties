spring.application.name=currency-api

spring.cloud.consul.host=localhost
spring.cloud.consul.port=8500

spring.config.import=consul:

bcb.base-url=https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata
bcb.data-cotacao=2025-10-14

resilience4j.retry.instances.bcb.max-attempts=3
resilience4j.retry.instances.bcb.wait-duration=1s
resilience4j.retry.instances.bcb.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException,br.edu.atitus.currencyapi.exception.CotacaoNaoEncontradaException

resilience4j.circuitbreaker.instances.bcb.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.bcb.sliding-window-size=5
resilience4j.circuitbreaker.instances.bcb.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bcb.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bcb.wait-duration-in-open-state=100s
resilience4j.circuitbreaker.instances.bcb.register-health-indicator=true
resilience4j.circuitbreaker.instances.bcb.ignore-exceptions=br.edu.atitus.currencyapi.exception.CotacaoNaoEncontradaException

management.endpoints.web.exposure.include=health,circuitbreakers,retries,caches